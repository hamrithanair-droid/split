<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UI verification — temp harness</title>
  <style>
    body { font-family: Consolas, monospace; padding: 20px; }
    iframe { width: 1160px; height: 2400px; border: 1px solid #ccc; }
    li.ok { color: #166534; } li.bad { color: #991b1b; }
  </style>
</head>
<body>
  <h1>UI verification harness (temporary)</h1>
  <pre id="summary">running…</pre>
  <ul id="list"></ul>
  <iframe id="app" src="index.html"></iframe>

  <script>
    (function () {
      var results = [];
      function report(name, ok, detail) {
        results.push({ name: name, ok: ok, detail: detail || "" });
      }
      function assert(name, cond, detail) {
        report(name, !!cond, cond ? "" : detail);
      }
      function sleep(ms) {
        return new Promise(function (r) { setTimeout(r, ms); });
      }
      function waitFor(fn, desc, tries) {
        tries = tries || 120;
        return new Promise(function (resolve, reject) {
          var n = 0;
          (function poll() {
            var value;
            try { value = fn(); } catch (e) { value = null; }
            if (value) return resolve(value);
            if (++n >= tries) return reject(new Error("timeout waiting for: " + desc));
            setTimeout(poll, 50);
          })();
        });
      }
      function makeFile(text, name) {
        return new File([text], name, { type: "text/csv" });
      }
      function setFiles(input, files) {
        var dt = new DataTransfer();
        files.forEach(function (f) { dt.items.add(f); });
        input.files = dt.files;
        input.dispatchEvent(new Event("change", { bubbles: true }));
      }
      function visible(node) {
        return node && !node.classList.contains("hidden") && !node.hidden;
      }
      function cellText(doc, tableSel, row, col) {
        var tr = doc.querySelectorAll(tableSel + " tbody tr")[row];
        if (!tr) return null;
        var td = tr.querySelectorAll("td")[col];
        return td ? td.textContent : null;
      }

      var frame = document.getElementById("app");

      frame.addEventListener("load", function () {
        var doc = frame.contentDocument;
        var win = frame.contentWindow;

        (async function run() {
          try {
            assert("app loads with expected title", /Batch File Toolkit/.test(doc.title));
            assert("libs loaded in app", win.XLSX && win.JSZip && win.Core, "XLSX/JSZip/Core missing");

            /* ---------------- SPLIT flow ---------------- */
            setFiles(doc.getElementById("split-input"),
              [makeFile("id,name\r\n007,Ann\r\n2,Bob\r\n3,Cat\r\n", "sample.csv")]);

            await waitFor(function () { return visible(doc.getElementById("split-options-card")); },
              "split options card visible");
            assert("split: file meta shows 3 rows x 2 cols",
              /3 data rows/.test(doc.getElementById("split-filemeta").textContent) &&
              /2 columns/.test(doc.getElementById("split-filemeta").textContent),
              doc.getElementById("split-filemeta").textContent);
            assert("split: preview keeps leading zeros (007)",
              cellText(doc, "#split-preview", 0, 0) === "007",
              "got " + cellText(doc, "#split-preview", 0, 0));
            assert("split: 2 column chips rendered",
              doc.querySelectorAll("#split-columns .chip").length === 2);

            doc.getElementById("split-size").value = "2";
            doc.getElementById("split-size").dispatchEvent(new Event("input", { bubbles: true }));
            await sleep(60);
            assert("split: plan shows 2 files for size 2",
              /2 files/.test(doc.getElementById("split-plan").textContent),
              doc.getElementById("split-plan").textContent);

            doc.getElementById("split-run").click();
            await waitFor(function () { return visible(doc.getElementById("split-result-card")); },
              "split result card visible");
            var statBlocks = doc.querySelectorAll("#split-stats > div");
            var filesCreated = null;
            statBlocks.forEach(function (block) {
              if (block.querySelector("dt").textContent === "Files created") {
                filesCreated = block.querySelector("dd").textContent;
              }
            });
            assert("split: stats report 2 files created",
              filesCreated === "2", "got " + filesCreated);

            /* ---------------- COMBINE flow ---------------- */
            assert("both tool sections visible on one page",
              visible(doc.getElementById("panel-split")) && visible(doc.getElementById("panel-consolidate")));
            setFiles(doc.getElementById("cons-input"), [
              makeFile("A,B\r\ndata1,data2\r\n", "file1.csv"),
              makeFile("B,A\r\ndata2x,data1x\r\n", "file2.csv"),
            ]);

            await waitFor(function () {
              return doc.querySelectorAll("#cons-list li").length === 2 &&
                visible(doc.getElementById("cons-review-card"));
            }, "2 files listed + review card visible");

            assert("cons(header): swapped columns realigned — row2 col A is data1x",
              cellText(doc, "#cons-preview", 1, 0) === "data1x",
              "got " + cellText(doc, "#cons-preview", 1, 0));
            assert("cons(header): column map has 2 output columns, all present",
              doc.querySelectorAll("#cons-map tbody tr").length === 2 &&
              doc.querySelectorAll("#cons-map td.map-yes").length === 4 &&
              doc.querySelectorAll("#cons-map td.map-no").length === 0);

            doc.querySelector('input[name="cons-mode"][value="stack"]').click();
            await sleep(80);
            assert("cons(stack): positional append — row2 col A is data2x",
              cellText(doc, "#cons-preview", 1, 0) === "data2x",
              "got " + cellText(doc, "#cons-preview", 1, 0));
            assert("cons(stack): headers come from first file",
              doc.querySelector("#cons-preview thead th").textContent === "A");

            doc.getElementById("cons-run").click();
            await waitFor(function () { return visible(doc.getElementById("cons-result-card")); },
              "consolidate result card visible");
            assert("cons: stats report 2 files merged",
              /Files merged/.test(doc.getElementById("cons-stats").textContent));

            /* remove one file, list should update */
            doc.querySelector("#cons-list li .fl-remove").click();
            await sleep(80);
            assert("cons: removing a file leaves 1 in the list",
              doc.querySelectorAll("#cons-list li").length === 1);
          } catch (err) {
            report("harness error", false, String(err && err.message || err));
          }

          var passed = results.filter(function (r) { return r.ok; }).length;
          var list = document.getElementById("list");
          results.forEach(function (r) {
            var li = document.createElement("li");
            li.className = r.ok ? "ok" : "bad";
            li.textContent = (r.ok ? "PASS  " : "FAIL  ") + r.name + (r.ok ? "" : "  =>  " + r.detail);
            list.appendChild(li);
          });
          var text = "UI TESTS " + (passed === results.length ? "PASSED" : "FAILED") +
            " " + passed + "/" + results.length;
          document.getElementById("summary").textContent = text;
          document.title = text;
        })();
      });
    })();
  </script>
</body>
</html>
